# SPDX-License-Identifier: GPL-3.0-or-later
# Runs on every push and pull request: format, lint, typecheck, test (incl. Lua), build, a
# release-build smoke test of the relay, licence checks.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Lua 5.1 (as in DCS) for the Lua bridge tests (dcs/export/test).
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SLATE_REQUIRE_LUA: '1'
      - run: pnpm build
      # The release bundle and single executable still build and start (P1.9).
      - run: node tools/release/build.mjs --what relay --target linux-x64
      - run: |
          mkdir -p /tmp/relay-smoke
          timeout 10 dist/release/slate-relay-*-linux-x64/slate-relay --data /tmp/relay-smoke --port 7999 > /tmp/relay-smoke.log 2>&1 || true
          cat /tmp/relay-smoke.log
          grep -q 'listening on TCP 7999' /tmp/relay-smoke.log
      - run: pnpm check:spdx
      - run: pnpm check:licenses
