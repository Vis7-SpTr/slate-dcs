# Runs on every push and pull request: format, lint, typecheck, test (incl. Lua), build, licence checks.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Lua 5.1 (as in DCS) for the Lua bridge tests (dcs/export/test).
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SLATE_REQUIRE_LUA: '1'
      - run: pnpm build
      - run: pnpm check:spdx
      - run: pnpm check:licenses
